<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}청년 생활법률 상담 AI{% endblock %}</title>
  <script>
    // 다크모드 초기화 (FOUC 방지 — 페인트 전에 테마 결정)
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">⚖</span>
        <span class="brand-text">
          <strong>청년 생활법률 상담 AI</strong>
          <em>Youth Legal Assistant</em>
        </span>
      </a>
      <button class="theme-toggle" onclick="toggleTheme()" role="switch" aria-label="라이트·다크 모드 전환" title="라이트·다크 모드 전환">
        <span class="tt-track">
          <span class="tt-knob">
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M3.5 12H1M23 12h-2.5M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19" stroke-linecap="round"/></svg>
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke-linejoin="round"/></svg>
          </span>
        </span>
      </button>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark sm">⚖</span>
        <strong>청년 생활법률 상담 AI</strong>
      </div>
      <p class="footer-note">
        국가법령정보센터 현행 법령에 근거한 일반 정보 안내 서비스입니다.
        단정적 법률 자문이 아니며, 구체적인 사건은 반드시 전문가와 상담하시기 바랍니다.
      </p>
      <p class="footer-copy">© 2026 Youth Legal Assistant</p>
    </div>
  </footer>
  <script>
    function toggleTheme() {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    }
  </script>
</body>
</html>
